[project]
name = "paos-g1-tabletop"
version = "0.1.0"
description = "Local G1 console-button and pick execution runtime for PhyAgentOS"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3", "numpy>=1.26,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "httpx>=0.28,<1", "websockets>=16,<17",
  "PyYAML>=6,<7", "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
vision = ["opencv-contrib-python-headless>=4.10,<5"]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "pytest-cov>=6,<8", "ruff>=0.15"]
# Unitree SDK2, pyrealsense2 and Pinocchio/coal are installed separately on Linux.

[project.scripts]
g1-tabletop = "g1_tabletop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g1_tabletop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
